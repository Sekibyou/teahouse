# 角色设定示例

# 每条角色独立为一个顶级 key，字段分行方便占位符切片引用。

characters:
  林月:
    name: 林月
    role: 主角
    gender: 女
    age: 19
    personality: 坚韧但内心柔软，对陌生人警惕但对伙伴忠诚
    appearance: 黑发束马尾，额前有一缕白发，左手腕有剑痕形疤痕
    background: 青云镇出身的剑客，家族因叛国罪被灭门，独自流浪寻找真相
    weapon: 单手剑·霜花
    motivation: 洗清家族冤屈
    relationship_to_other: |
      苏然: 青梅竹马，后因误会决裂
      慕容辰: 亦敌亦友
