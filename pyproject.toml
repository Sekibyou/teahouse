[project]
name = "teahouse"
version = "1.06"
description = "Harness Engineering based novel / text adventure engine"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "sse-starlette>=2.0",
    "uvicorn[standard]>=0.29",
    "fastapi>=0.111",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    "aiosqlite>=0.20",
    "bcrypt>=4.0",
    "pyjwt>=2.8",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]
