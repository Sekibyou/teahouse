# 正文生成 Payload 配置模板
# 复制此文件到 temp/generate-config-{楼层号}-{版本号}.yaml 后修改使用
# {{path}} 占位符会在 Generate 时自动展开为文件内容
#
# 工作流：
#   1. 复制此文件（或上一楼层的 config）到 temp/generate-config-{N}-1.yaml
#   2. 编辑：更新楼层引用、变量状态描述、用户写作要求
#   3. Generate(source_file="temp/generate-config-{N}-1.yaml", path="temp/draft-{N}-1.md")
#   4. 用户满意后提交，旧 config 清理，保留最新版

- role: system
  content: |
    你是一位资深小说作家，需要参考以下设定进行创作。

    {{settings/characters.md}}
    {{settings/world.md}}

- role: user
  content: |
    以下是前文内容，请基于此续写下一章：
    {{glob:floors/floor-*.md}}

- role: user
  content: |
    （在此填入用户的写作要求）
