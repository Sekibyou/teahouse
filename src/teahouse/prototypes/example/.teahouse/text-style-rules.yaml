# 文本样式规则 — 符号着色配置
#
# 当 rich_text 内容被渲染时，匹配的符号对会被包裹在自定义 HTML 中。
# 适用于对书名号、引号、特定标记等着色，增强阅读体验。
#
# 导演可通过 teahouse-sandbox-richtext-render skill 编辑此文件。
#
# 每条规则字段:
#   start_symbol  - 起始符号（支持多字符，如 "《"）
#   end_symbol    - 结束符号（与 start 相同时表示对称型，如引号）
#   start_html    - 在起始符号前插入的 HTML 标签
#   end_html      - 在结束符号后插入的 HTML 标签
#   enabled       - 是否启用
#   order         - 处理顺序（数字小者优先；建议先处理长符号，避免被短符号误匹配）
#
# 注意:
#   - 规则在 BBCode 解析之后、Markdown 解析之前应用
#   - 跨 HTML 标签匹配（即符号对可以跨越 [b] 等 BBCode 标签）
#   - 不匹配已被 HTML 标签包裹的内容
#
rules:
  - start_symbol: "《"
    end_symbol: "》"
    start_html: '<span style="color: #e5c07b;">'
    end_html: "</span>"
    enabled: true
    order: 1
  
  - start_symbol: "「"
    end_symbol: "」"
    start_html: '<span style="color: #56b6c2;">'
    end_html: "</span>"
    enabled: true
    order: 2
  
  - start_symbol: '"'
    end_symbol: '"'
    start_html: '<span style="color: #98c379;">'
    end_html: "</span>"
    enabled: false
    order: 3
