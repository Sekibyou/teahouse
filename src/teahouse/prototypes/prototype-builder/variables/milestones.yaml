# 原型搭建工作进度

# 每条里程碑的状态：pending | in_progress | done
# 导演应在完成每个里程碑后更新状态

milestones:
  - name: 设定细化
    description: 与用户深入讨论世界观、角色、叙事风格等，在 temp/ 下打草稿
    status: pending

  - name: 设定归纳
    description: 将草稿提炼为结构化设定文件，写入 _prototype/settings/
    status: pending

  - name: 变量系统确认
    description: |
      与用户确认需要追踪的关键变量（金币、装备、任务、好感度等）。
      约定每个变量在何时更新、由哪个 skill 负责更新。
      变量值应分行书写，方便后续 WriteLine 工具修改。
    status: pending

  - name: teahouse.md 编写
    description: |
      基于设定和变量，编写 _prototype/teahouse.md。
      包含身份定义、楼层配置、总结规则、输出块 label 命名、skill 路由。
    status: pending

  - name: 前端决策
    description: |
      询问用户前端方案：
      - 第三方前端 → 确认 label 命名规则，无需 sandbox
      - Teahouse 沙盒 → 参考 references/sandbox-reference/ 创建 _prototype/sandbox/
    status: pending

  - name: 沙盒构建
    description: |
      参考 references/sandbox-reference/ 下的代码，创建 _prototype/sandbox/。
      通过 Output 推送到前端测试，确保能跑通。
      包含 bootstrap.js、theme.css，及按需的 ui_js。
    status: pending

  - name: 文本样式规则
    description: 确认是否需要在 _prototype/.teahouse/text-style-rules.yaml 中配置符号着色
    status: pending

  - name: 试玩验证
    description: 用 _prototype/ 的内容启动一个新实例，跑通流程验证可用性
    status: pending

  - name: 打包导出
    description: 使用 teahouse-export-prototype skill 将 _prototype/ 导出为最终原型
    status: pending
