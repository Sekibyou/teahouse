# 变量系统模板

# 变量值应分行书写，方便导演后续使用 WriteLine 工具精确修改单个值。
# 每个变量一行，避免嵌套结构。

# ---- 全局变量 ----
# 贯穿整个故事的变量，如角色修为、核心关系、主线目标等
gold: 0
companion_count: 0

# ---- 局部变量 ----
# 仅在某段剧情内有效的变量
# event_example: |
#   开始于 floor-0
#   状态: 未触发

# ---- 变量变更说明 ----
# 这些变量应该在以下时机更新：
# - gold: 获得/消费金币时，由 generate-floor skill 更新
# - companion_count: 伙伴加入/离开时，由 generate-floor skill 更新