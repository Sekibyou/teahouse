# ============================================================
# 工作进度记录
# ============================================================
# 此区域由 AI 和用户在实际工作中动态维护。
# 记录：用户需求、当前进度、下一步计划、产生的临时文件等。
#
# 字段说明：
#   status: pending | in_progress | done | skipped | blocked
#   files:  该任务在 temp/ 下产生的关联文件
#   note:   补充说明、用户反馈、待确认事项等
# ============================================================
#
# ============================================================
# Git 版本管理
# ============================================================
# 合理使用 git 进行版本管理，尤其是在以下场景：
#
# 1. 沙盒代码迭代
#    - 修改 _prototype/sandbox/ 下的 js/css 文件前先 commit 当前状态
#    - 每次代码改动验证通过后 commit，commit message 描述具体改动
#    - 改坏时可通过 git 回退，无需手动备份
#
# 2. 设定文件修改
#    - 大规模调整 settings/ 或 variables/ 前先 commit
#    - 用户确认后再 commit 锁定
#
# 3. 阶段完成时
#    - 每完成一个建议工作流阶段，commit 一次
#    - 在 tasks 条目中记录对应的 commit hash，方便回溯
#
# 4. commit 规范
#    - 提交类型使用 GitCommit 的 "other" 类型
#    - message 内加前缀：style: / feat: / fix:（沙盒代码）、content:（设定）、vars:（变量）
# ============================================================

tasks:
  # ---- 示例条目，开始工作后替换或删除 ----
  - name: 示例任务
    status: pending
    description: 这是一个示例，展示如何记录任务
    files: []
    note: 开始工作后删除此条目

# ============================================================
# 建议工作流
# ============================================================
# 以下为建议的原型搭建阶段，供 AI 和用户参考。
# 实际执行顺序和内容可根据需要灵活调整。
# 不应盲目按顺序执行，而应根据用户需求灵活跳转。
# ============================================================

suggested_workflow:
  - name: 设定细化
    description: 与用户深入讨论世界观、角色、叙事风格等，在 temp/ 下打草稿

  - name: 设定归纳
    description: 将草稿提炼为结构化设定文件，写入 _prototype/settings/

  - name: 变量系统确认
    description: |
      与用户确认需要追踪的关键变量（金币、装备、任务、好感度等）。
      约定每个变量在何时更新、由哪个 skill 负责更新。
      变量值应分行书写，方便 WriteLine 工具精确修改。

  - name: teahouse.md 编写
    description: |
      基于设定和变量，编写 _prototype/teahouse.md。
      包含身份定义、楼层配置、总结规则、输出块 label 命名、skill 路由。

  - name: 前端自定义
    description: |
      询问用户是否需要自定义前端界面。
      如需要，直接在 _prototype/sandbox/ 现有文件上修改。

  - name: 文本样式规则
    description: 确认是否需要在 _prototype/.teahouse/text-style-rules.yaml 中配置符号着色

  - name: 打包前检查
    description: |
      检查 _prototype/ 目录结构完整性。
      清理无用的占位符文件。
      建议用户用原型创建实例试玩验证。

  - name: 打包导出
    description: 使用 teahouse-export-prototype skill 将 _prototype/ 导出为 .teabrew
