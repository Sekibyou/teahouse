# 世界观设定示例

# 每个维度独立为一个 key，字段分行方便占位符切片引用。

world:
  name: 苍月大陆
  era: 古代奇幻
  tech_level: 冷兵器为主，少量魔法科技
  main_regions: |
    青云山: 剑修宗门·青云宗所在地，山脉绵延，灵气充沛
    黑水沼泽: 南部蛮荒之地，毒虫瘴气弥漫，魔族残部藏身
    天都城: 帝国首都，政治与商业中心
    北境冰原: 极寒之地，传说中的上古遗迹所在地
  factions: |
    青云宗: 正道第一剑修宗门，主张以剑证道
    天机阁: 情报组织，表面中立，暗中操控多国政局
    暗影会: 地下刺客组织，接单不问善恶
  magic_system: |
    灵力修炼：吸收天地灵气，凝聚丹田
    境界划分：练气→筑基→金丹→元婴→化神
    禁忌之术：血祭、魂契等以寿命或灵魂为代价的禁术
  current_events: |
    天都城皇位更迭，三皇子与九公主争夺继承权
    北境异动，上古遗迹即将现世
